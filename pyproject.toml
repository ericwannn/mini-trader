[project]
name = "minitrader"
version = "0.4.0"
description = "MiniTrader — 个人交易辅助工具（宏观资讯采集、摘要、涨停复盘等）"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "fastapi>=0.128.8",
    "uvicorn>=0.39.0",
    "jinja2>=3.1.6",
    "httpx>=0.28.1",
    "akshare>=1.14",
    "markdown>=3.5",
    "bleach>=6.0",
]

[project.scripts]
minitrader = "minitrader.cli:main"
minitrader-server = "minitrader.service:main"

[tool.uv.sources]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
minitrader = ["db/schema.sql", "frontend/templates/*.html"]
